# Configuration de distribution (outil "dist" / cargo-dist).
# Le projet Cargo est a la racine du depot.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-msvc"]
# The installers to generate for each app
installers = ["powershell"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Pas d'updater cargo-dist : l'app se met a jour elle-meme via github.com
# (voir src/updater.rs), sans api.github.com ni token.
install-updater = false
